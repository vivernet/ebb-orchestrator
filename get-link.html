<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ebb Orchestrator - Получить ссылку</title>
    <style>
        body { font-family: system-ui; padding: 20px; }
        .step { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        input { width: 100%; padding: 8px; font-family: monospace; }
        button { padding: 10px 20px; cursor: pointer; }
        .success { background: #d4edda; }
    </style>
</head>
<body>
    <h1>Ebb Orchestrator</h1>
    
    <div class="step">
        <strong>Шаг 1:</strong> В терминале введи:
        <br><code>pnpm start</code>
    </div>
    
    <div class="step">
        <strong>Шаг 2:</strong> Когда сервер запустится, скопируй токен из файла:
        <br><input type="text" id="token" placeholder="Вставь bootstrapToken здесь">
    </div>
    
    <div class="step">
        <button onclick="generateLink()">Создать ссылку</button>
    </div>
    
    <div class="step success" id="result" style="display:none">
        <strong>Открой эту ссылку:</strong>
        <br><input type="text" id="link">
    </div>
    
    <script>
        function generateLink() {
            const token = document.getElementById('token').value.trim();
            if (!token) {
                alert('Вставь токен');
                return;
            }
            const link = 'http://localhost:3000/#ebb-bootstrap=' + encodeURIComponent(token);
            document.getElementById('link').value = link;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>

name: Production gates

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  process-scope-linux-acceptance:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EBB_RUN_NATIVE_SCOPE_ACCEPTANCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: ">=12.0.0"
          runtime: node@24
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Setup Python for synthetic native payload
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start ephemeral runner user systemd manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          user="$(id -un)"
          runtime_dir="/run/user/${uid}"
          command -v loginctl
          command -v systemctl
          sudo systemctl start systemd-logind.service
          sudo loginctl enable-linger "$user"
          sudo systemctl start "user@${uid}.service"
          for attempt in {1..30}; do
            if [[ -S "${runtime_dir}/bus" ]]; then break; fi
            sleep 1
          done
          test -S "${runtime_dir}/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir" >> "$GITHUB_ENV"
      - name: Verify native Linux runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          systemd --version
          test "$(stat -fc '%T' /sys/fs/cgroup)" = "cgroup2fs"
          test -r /sys/fs/cgroup/cgroup.controllers
          test -n "${HOME:-}"
          test -n "${XDG_RUNTIME_DIR:-}"
          test -d "$XDG_RUNTIME_DIR"
          command -v systemd-run
          command -v systemctl
          command -v setsid
          command -v journalctl
          systemctl --user is-system-running
          systemctl --user show-environment >/dev/null
          probe_unit="ebb-process-scope-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$$.service"
          cleanup_probe() {
            systemctl --user stop "$probe_unit" >/dev/null 2>&1 || true
            systemctl --user reset-failed "$probe_unit" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          systemd-run --user --collect --unit="$probe_unit" \
            --property=Type=exec \
            --property=ExitType=cgroup \
            --property=KillMode=control-group \
            --property=Delegate=no \
            --property=ProtectControlGroups=yes \
            --property=Restart=no \
            /usr/bin/sleep 60
          for attempt in {1..20}; do
            if systemctl --user is-active --quiet "$probe_unit"; then break; fi
            sleep 0.25
          done
          systemctl --user is-active --quiet "$probe_unit"
          expected_properties=$'Type=exec\nExitType=cgroup\nKillMode=control-group\nDelegate=no\nProtectControlGroups=yes\nRestart=no'
          while IFS='=' read -r property expected; do
            actual="$(systemctl --user show "$probe_unit" --property="$property" --value)"
            if [[ "$actual" != "$expected" ]]; then
              printf 'Transient systemd service property mismatch: %s\n' "$property" >&2
              exit 1
            fi
          done <<< "$expected_properties"
          systemctl --user stop "$probe_unit"
          systemctl --user reset-failed "$probe_unit" >/dev/null 2>&1 || true
          trap - EXIT
          probe_removed=no
          for attempt in {1..20}; do
            if load_state="$(systemctl --user show "$probe_unit" --property=LoadState --value 2>/dev/null)"; then
              if [[ "$load_state" == "not-found" ]]; then probe_removed=yes; break; fi
            fi
            sleep 0.25
          done
          if [[ "$probe_removed" != yes ]]; then
            printf 'Transient systemd service was not removed after the probe.\n' >&2
            exit 1
          fi
      - name: Build native source-snapshot helpers
        shell: bash
        run: |
          set -euo pipefail
          compiler=c++
          if [[ -v CXX ]]; then compiler="$CXX"; fi
          if ! command -v "$compiler" >/dev/null 2>&1; then
            printf 'Required C++ compiler is unavailable: %s\n' "$compiler" >&2
            exit 1
          fi
          compiler_identity="$("$compiler" --version | head -n 1)"
          printf 'Compiler identity: %s\n' "$compiler_identity" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Build commands: build:hermes-profile-path and build:linux-hermes-launcher\n' >> "$GITHUB_STEP_SUMMARY"
          set +e
          pnpm --filter @ebb-orchestrator/server build:hermes-profile-path && pnpm --filter @ebb-orchestrator/server build:linux-hermes-launcher
          build_status=$?
          set -e
          printf 'Build exit code: %s\n' "$build_status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$build_status" -ne 0 ]]; then exit "$build_status"; fi
      - name: Validate Linux namespace prerequisite contract
        run: node --test scripts/linux-hermes-namespace-prerequisite.test.mjs
      - name: Verify and prepare exact Linux helper user namespace permission
        shell: bash
        run: bash scripts/linux-hermes-namespace-prerequisite.sh setup
      - name: Run native POSIX terminal Hermes cleanup race acceptance
        run: node apps/server/scripts/test-hermes-profile-path-native.mjs --posix-cleanup-race-only
      - name: Run native source-snapshot GC and inventory-boundary probe
        run: node apps/server/scripts/test-hermes-profile-path-native.mjs --source-cache-gc-only
      - name: Run native provider-free process-scope acceptance
        run: pnpm --filter @ebb-orchestrator/server exec vitest run test/e2e/hermes-process-scope.acceptance.test.ts
      - name: Run native provider-free source-snapshot acceptance
        run: pnpm --filter @ebb-orchestrator/server exec vitest run test/e2e/hermes-source-snapshot.acceptance.test.ts
      - name: Remove ephemeral Linux helper AppArmor profiles
        if: ${{ always() }}
        shell: bash
        run: bash scripts/linux-hermes-namespace-prerequisite.sh cleanup

  hermes-process-scope-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EBB_RUN_NATIVE_SCOPE_ACCEPTANCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: ">=12.0.0"
          runtime: node@24
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Setup Python for synthetic native payload
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows native helper with Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installPath) { throw "VISUAL_STUDIO_CXX_BUILD_TOOLS_UNAVAILABLE" }
          $developerCommand = 'call "' + (Join-Path $installPath "Common7\Tools\VsDevCmd.bat") + '" -arch=amd64 -host_arch=amd64 && set'
          $environmentLines = & cmd.exe /d /s /c $developerCommand
          if ($LASTEXITCODE -ne 0) { throw "VISUAL_STUDIO_DEVELOPER_ENVIRONMENT_FAILED" }
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              $name = $line.Substring(0, $separator)
              $value = $line.Substring($separator + 1)
              Set-Item -Path "Env:$name" -Value $value
            }
          }
          pnpm --filter @ebb-orchestrator/server build:hermes-profile-path
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_HERMES_PROFILE_HELPER_BUILD_FAILED" }
          pnpm --filter @ebb-orchestrator/server build:windows-run-supervisor
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_PROCESS_SCOPE_HELPER_BUILD_FAILED" }
      - name: Run native source-snapshot GC and inventory-boundary probe
        run: node apps/server/scripts/test-hermes-profile-path-native.mjs --source-cache-gc-only
      - name: Run native provider-free process-scope acceptance
        run: pnpm --filter @ebb-orchestrator/server exec vitest run test/e2e/hermes-process-scope.acceptance.test.ts
      - name: Run executable EBB3 frame and nonce-ACK acceptance
        run: node apps/server/scripts/test-windows-run-supervisor-frame.mjs
      - name: Run native provider-free Hermes profile-target handle acceptance
        run: node apps/server/scripts/test-windows-run-supervisor-targets.mjs
      - name: Run production Hermes profile path-chain integration acceptance
        env:
          # The user's TEMP tree can grant foreign principals write access, which the
          # strict ancestor policy correctly rejects. The test creates a fresh private
          # fixture directly under the system volume root without changing its ACL.
          EBB_PROFILE_CHAIN_FIXTURE_ROOT: 'C:\\'
        run: pnpm --filter @ebb-orchestrator/server exec vitest run test/e2e/hermes-profile-path-chain.acceptance.test.ts
      - name: Run native provider-free source-snapshot acceptance
        run: pnpm --filter @ebb-orchestrator/server exec vitest run test/e2e/hermes-source-snapshot.acceptance.test.ts

  keyring-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: ">=12.0.0"
          runtime: node@24
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate keyring acceptance workflow
        run: node --test scripts/keyring-acceptance.test.mjs
      - name: Run real OS keyring acceptance
        run: pnpm exec tsx apps/server/scripts/keyring-smoke.ts

  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "24.x"
            runtime: node@24
          - node-version: "26.x"
            runtime: node@26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: ">=12.0.0"
          runtime: ${{ matrix.runtime }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Local-user stdin smoke and web build
        run: |
          node scripts/local-user-stdin-smoke.mjs
          pnpm web:build
      - name: E2E harness contracts
        run: node --test scripts/security-audit-evidence.test.mjs apps/web/test/e2e/credential-handoff.test.mjs
      - name: Dependency audit
        id: dependency-audit
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/security-audit-evidence.mjs --output "artifacts/security/pnpm-audit-prod-${GITHUB_SHA}.json"
      - name: Upload dependency audit evidence
        if: ${{ !cancelled() && steps.dependency-audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: pnpm-audit-prod-${{ github.sha }}
          path: artifacts/security/pnpm-audit-prod-${{ github.sha }}.json
          if-no-files-found: error
      - name: Fail if dependency audit failed
        if: ${{ !cancelled() && steps.dependency-audit.outcome == 'failure' }}
        run: exit 1
      - name: Repository integrity
        run: git diff --check
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm --dir apps/web test:e2e

name: Production gates

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "24.x"
            runtime: node@24
          - node-version: "26.x"
            runtime: node@26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: ">=12.0.0"
          runtime: ${{ matrix.runtime }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build server and web
        run: |
          pnpm server:build
          node scripts/local-user-stdin-smoke.mjs
          pnpm web:build
      - name: Dependency audit
        id: dependency-audit
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/security-audit-evidence.mjs --output "artifacts/security/pnpm-audit-prod-${GITHUB_SHA}.json"
      - name: Upload dependency audit evidence
        if: ${{ !cancelled() && steps.dependency-audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: pnpm-audit-prod-${{ github.sha }}
          path: artifacts/security/pnpm-audit-prod-${{ github.sha }}.json
          if-no-files-found: error
      - name: Fail if dependency audit failed
        if: ${{ !cancelled() && steps.dependency-audit.outcome == 'failure' }}
        run: exit 1
      - name: Repository integrity
        run: git diff --check
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm --dir apps/web test:e2e

name: Production gates

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          runtime: node@24
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build server and web
        run: |
          pnpm server:build
          pnpm web:build
      - name: Dependency audit
        id: dependency-audit
        continue-on-error: true
        run: node scripts/security-audit-evidence.mjs --output "artifacts/security/pnpm-audit-prod-${GITHUB_SHA}.json"
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-prod-${{ github.sha }}
          path: artifacts/security/pnpm-audit-prod-${{ github.sha }}.json
          if-no-files-found: error
      - name: Fail if dependency audit failed
        if: steps.dependency-audit.outcome == 'failure'
        run: exit 1
      - name: Repository integrity
        run: git diff --check
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm --dir apps/web test:e2e
